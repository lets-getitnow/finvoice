<!doctype html>
<!-- Static DOM contract for app.mjs; source addresses are inserted with textContent. -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Speak or type with Finvoice.">
<title>Finvoice</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app">
<!-- Disabled until bootstrap mounts; typed Enter and Speak share the server tool flow. -->
<form id="search-form" autocomplete="off">
<label class="sr-only" for="address">Text or property address</label>
<input id="address" name="address" type="text" placeholder="Type or speak…" maxlength="250" enterkeyhint="send">
<button id="submit" type="submit" class="submit-button" aria-label="Submit address" disabled>Enter</button>
<button id="talk" type="button" disabled><span id="talk-label">Speak</span></button>
</form>
<!-- Live status and sign-in recovery are controlled by the controller. -->
<p id="status" role="status" hidden></p>
<a id="sign-in" href="/signin-with-chatgpt?return_to=%2F" target="_top" hidden>Sign in with ChatGPT</a>
<p id="transcript" aria-live="polite" hidden></p>
<!-- At most three accessible address-card buttons are created here; suggestions contain no headline price. -->
<section id="choices-panel" class="choices-panel" aria-labelledby="choices-heading" hidden>
<div class="choices-header"><h2 id="choices-heading">Possible matches</h2><p id="choices-hint">Select an address to see its price.</p></div>
<div id="choices" class="choice-list" role="group" aria-label="Address choices"></div>
</section>
<!-- Only a committed exact/confirmed result may populate the separate price output. -->
<section id="answer" class="answer" aria-label="Selected property" hidden>
<p id="answer-label" class="answer-label" hidden>Matched address</p>
<p id="result" aria-live="polite" hidden></p>
<output id="price" aria-label="Property value" aria-describedby="result" aria-live="polite" hidden></output>
</section>
</main>
<!-- Import after the DOM exists; bootstrap surfaces startup failures and leaves controls disabled. -->
<script type="module" src="bootstrap.mjs"></script>
</body>
</html>
